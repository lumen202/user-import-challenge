services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-userimport}
      POSTGRES_USER: ${DB_USER:-userimport}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-userimport}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data

volumes:
  dbdata:
